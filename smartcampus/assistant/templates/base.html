{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Smart Campus AI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #0f172a, #1e293b);
            color: white;
            font-family: Arial, sans-serif;
        }
        .navbar { background: #111827; }
        .card {
            background: #1e293b;
            border: none;
            border-radius: 15px;
            color: white;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }
        .btn-custom { background: #3b82f6; color: white; }
        .btn-custom:hover { background: #2563eb; color: white; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark px-4">
    <a class="navbar-brand" href="{% url 'chatbot' %}">🎓 SmartCampusAI</a>
    <span id="clock" class="text-white ms-3" aria-label="Current time"></span>
    <div class="navbar-nav ms-auto align-items-lg-center">
        {% if user.is_authenticated %}
            <span class="nav-link">Hi, {{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" class="d-flex">
                {% csrf_token %}
                <button type="submit" class="nav-link btn btn-link">Logout</button>
            </form>
        {% else %}
            <a class="nav-link" href="{% url 'signup' %}">Signup</a>
            <a class="nav-link" href="{% url 'login' %}">Login</a>
        {% endif %}
        <a class="nav-link" href="{% url 'chatbot' %}">Home</a>
        <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
        <a class="nav-link" href="{% url 'lostfound' %}">Lost &amp; Found</a>
        <a class="nav-link" href="{% url 'events' %}">Events</a>
    </div>
</nav>
<main class="container mt-4">
    {% block content %}{% endblock %}
</main>
<script>
function updateClock() {
    const clock = document.getElementById("clock");
    if (clock) clock.textContent = new Date().toLocaleTimeString();
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>

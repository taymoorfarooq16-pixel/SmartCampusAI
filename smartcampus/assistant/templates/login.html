{% extends 'base.html' %}
{% block title %}Student login · Smart Campus AI{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h1 class="h2 text-center mb-4">Student login</h1>
            {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
            <form method="post">
                {% csrf_token %}
                <label class="form-label" for="id_username">Username</label>
                <input id="id_username" type="text" name="username" class="form-control mb-3" autocomplete="username" required>
                <label class="form-label" for="id_password">Password</label>
                <input id="id_password" type="password" name="password" class="form-control mb-3" autocomplete="current-password" required>
                <button type="submit" class="btn btn-custom w-100">Log in</button>
            </form>
            <p class="mt-3 mb-0 text-center">New here? <a href="{% url 'signup' %}">Create an account</a></p>
        </div>
    </div>
</div>
{% endblock %}
